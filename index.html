<script>
// ===== calculation engine (pure) =====
const RENT_TYPE='الايجارات', REFUND_TYPE='أموال مردودة الى المريض', SALARY_TYPE='مرتب';
function r2(x){return Math.round((x+Number.EPSILON)*100)/100}
function monthsBetween(a,b){const out=[];let [y,m]=a.split('-').map(Number);const [by,bm]=b.split('-').map(Number);
  while(y<by||(y===by&&m<=bm)){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}return out}
function rentFor(cfg,k){let v=0;for(const s of [...cfg.rent].sort((a,b)=>a.from<b.from?-1:1)){if(s.from<=k)v=s.amount}return v}
function mgmtRateFor(cfg,k){return k>=cfg.mgmtFrom?cfg.mgmtRate:0}
function catSpend(cfg,name){const c=cfg.cats.find(c=>c.name===name);return c?c.spend!==false:true}
function monthEnd(k){const [y,m]=k.split('-').map(Number);return k+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')}

function normInfo(t,info){let s=String(info||'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').trim();
  if(t===SALARY_TYPE){if(/محاسب/.test(s))return 'راتب المحاسب القانوني';if(/سلف/.test(s))return 'سلف موظفين';if(/رواتب|مرتبات/.test(s))return 'رواتب الموظفين (الشهر)'}
  return s.replace(/[0-9٠-٩\/]+/g,'').replace(/\s+/g,' ').trim()}
function computeMonth(cfg,med,adjs,k){
  const p=med['pay-'+k], e=med['exp-'+k];
  let revenue=0,balance=0,refundsSys=0,count=0,refCount=0;const byPay={};
  if(p)for(const row of p.rows){const [d,a,t,ref]=row;const n=row[11]||1; if(t==='Balance'){balance+=a;continue} revenue+=a;count+=n;byPay[t]=(byPay[t]||0)+a; if(ref){refundsSys+=a;refCount+=n} }
  let expTotal=0,rentRec=0,refundExp=0;const byType={},byInfo={};
  if(e)for(const [ts,a,t,info] of e.rows){ expTotal+=a; if(t===RENT_TYPE){rentRec+=a;continue} if(t===REFUND_TYPE){refundExp+=a;continue}
    byType[t]=(byType[t]||0)+a; const key=t+'|'+normInfo(t,info); byInfo[key]=(byInfo[key]||0)+a }
  const A=adjs.filter(x=>x.month===k);
  const adjRev=A.filter(x=>x.kind==='revenue').reduce((s,x)=>s+x.amount,0);
  const adjRef=A.filter(x=>x.kind==='refund').reduce((s,x)=>s+x.amount,0);
  const adjOpex=A.filter(x=>x.kind==='opex');
  for(const x of adjOpex){const t=x.etype||'تسويات';byType[t]=(byType[t]||0)+x.amount;const key=t+'|'+normInfo(t,x.label);byInfo[key]=(byInfo[key]||0)+x.amount}
  revenue=r2(revenue+adjRev); const refunds=r2(refundsSys+adjRef); const netRev=r2(revenue-refunds);
  const opex=r2(expTotal-rentRec-refundExp+adjOpex.reduce((s,x)=>s+x.amount,0));
  const rent=rentFor(cfg,k), rate=mgmtRateFor(cfg,k), mgmt=r2(netRev*rate);
  const totalExp=r2(opex+rent+mgmt), net=r2(netRev-totalExp);
  const breakEven=rate<1?r2((opex+rent)/(1-rate)):0;
  // goal in payments: average net payment, payments needed for break-even / target / rent
  const target=+cfg.target||0, targetRev=rate<1?r2((opex+rent+target)/(1-rate)):0;
  const netCount=count-refCount;
  const ap=med['apt-'+k];let sessions=0;const bySvc={};
  if(ap)for(const r of ap.rows){if(r[5]&&r[5]!=='Completed')continue;sessions++;bySvc[r[1]]=(bySvc[r[1]]||0)+1}
  const hasApt=sessions>0, units=hasApt?sessions:netCount, avgPay=units>0?r2(netRev/units):0;
  const need=v=>avgPay>0?Math.ceil(v/avgPay):null;
  const needBE=need(breakEven), needT=need(targetRev), rentPays=avgPay>0?Math.ceil(rent/((1-rate)*avgPay)):null;
  return {k,hasPay:!!p,hasExp:!!e,revenue,balance:r2(balance),refunds,netRev,opex,rent,rentRec:r2(rentRec),refundExp:r2(refundExp),rate,mgmt,totalExp,net,
    margin:netRev?net/netRev:0,breakEven,gap:r2(netRev-breakEven),count,netCount,hasApt,sessions,bySvc,units,avgPay,needBE,target,targetRev,needT,rentPays,opCash:r2(netRev-opex-mgmt),byPay,byType,byInfo,salaries:r2(byType[SALARY_TYPE]||0)}
}

function compute(cfg,med,adjs,fund,endK){
  const months=monthsBetween(cfg.startMonth,endK).map(k=>computeMonth(cfg,med,adjs,k));
  let cum=0;months.forEach((m,i)=>{cum=r2(cum+m.net);m.cum=cum;m.change=i?r2(m.net-months[i-1].net):null;m.growth=i&&months[i-1].netRev?m.netRev/months[i-1].netRev-1:null});
  const sum=f=>r2(months.reduce((s,m)=>s+m[f],0));
  const T={revenue:sum('revenue'),refunds:sum('refunds'),netRev:sum('netRev'),opex:sum('opex'),rent:sum('rent'),mgmt:sum('mgmt'),totalExp:sum('totalExp'),net:sum('net'),salaries:sum('salaries')};
  T.margin=T.netRev?T.net/T.netRev:0;
  // partners
  const cut=monthEnd(endK);
  const inCut=f=>!f.d||f.d<=cut;
  const P={A:{cut:0,all:0},K:{cut:0,all:0}};
  const cats={};
  for(const f of fund){P[f.p].all+=f.amt; if(inCut(f)){P[f.p].cut+=f.amt; cats[f.cat]=cats[f.cat]||{A:0,K:0}; cats[f.cat][f.p]+=f.amt}}
  for(const x of ['A','K'])for(const y of ['cut','all'])P[x][y]=r2(P[x][y]);
  const diffAll=r2(P.K.all-P.A.all), diffCut=r2(P.K.cut-P.A.cut);
  // cash: funding not spent (non-spend categories) + operating cash result
  let unspent=0,spent=0;for(const f of fund){if(!inCut(f))continue; if(catSpend(cfg,f.cat))spent+=f.amt; else unspent+=f.amt}
  const opCash=r2(T.netRev-T.opex-T.mgmt);
  const cash=r2(unspent+opCash);
  // return of funding (no profits)
  const shareA=cfg.shareA??0.5;
  const firstA=Math.max(0,-diffAll), firstK=Math.max(0,diffAll);
  const rest=r2(cash-firstA-firstK);
  const dist={firstA,firstK,restA:r2(rest*shareA),restK:r2(rest*(1-shareA))};
  dist.A=r2(dist.firstA+dist.restA);dist.K=r2(dist.firstK+dist.restK);
  const pending=fund.filter(f=>f.pending);
  return {months,T,P,diffAll,diffCut,cats,spent:r2(spent),unspent:r2(unspent),opCash,cash,dist,pending,endK};
}
if(typeof module!=='undefined')module.exports={compute,computeMonth,monthsBetween,r2};

// ===== minimal styled xlsx writer (no dependencies) =====
const XW=(()=>{
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
  const enc=s=>new TextEncoder().encode(s);
  function zip(files){ // files: [{name, data:Uint8Array}]
    const parts=[],cen=[];let off=0;
    for(const f of files){const nm=enc(f.name),d=f.data,crc=crc32(d);
      const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
      h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
      parts.push(new Uint8Array(h.buffer),nm,d);
      const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);
      c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
      cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
    const cs=cen.reduce((s,x)=>s+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
    const all=[...parts,...cen,new Uint8Array(e.buffer)];const out=new Uint8Array(all.reduce((s,x)=>s+x.length,0));let p=0;for(const x of all){out.set(x,p);p+=x.length}return out}
  const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  // style registry
  function Styles(){
    const fonts=['<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>'],fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'],

  // ---------- revenue for a period ----------
  function revenue(D,from,to){
    const months=monthsBetween(from,to),P=payRows(D,months),A=D.adj.filter(a=>months.includes(a.month)&&a.kind!=='opex');
    const DS='الدفعات',rv=a=>`${q(DS)}!${a}:${a}`;
    const methods=[...new Set(P.filter(p=>p.type!=='Balance').map(p=>p.type))];
    const rows=[[c(`الإيرادات من ${ml(from)} لـ ${ml(to)} - FIX ZONE`,'title')],[c('الشهر','head'),c('كود','head'),...methods.map(m=>c(m,'head')),c('إجمالي التحصيلات','head'),c('مردودات','head'),c('صافي الإيراد','head'),c('عدد الدفعات','head'),c('من رصيد المريض (مش إيراد)','head')]];
    const mc=methods.length;
    months.forEach((k,i)=>{const r=i+3,B=`$B${r}`;const pk=P.filter(p=>p.k===k);const tot=sum(pk.filter(p=>p.type!=='Balance'),p=>p.amt);const ref=sum(pk.filter(p=>p.ref&&p.type!=='Balance'),p=>p.amt);
      rows.push([c(ml(k),'lab'),c(mk(k),'key'),...methods.map((m,j)=>c(sum(pk.filter(p=>p.type===m),p=>p.amt),'num',`SUMIFS(${rv('H')},${rv('A')},${B},${rv('G')},${C(j+2)}$2)`)),
        c(tot,'numB',`SUM(C${r}:${C(mc+1)}${r})`),c(ref,'num',`SUMIFS(${rv('H')},${rv('A')},${B},${rv('I')},"نعم",${rv('G')},"<>Balance")`),c(r2(tot-ref),'numB',`${C(mc+2)}${r}-${C(mc+3)}${r}`),
        c(pk.filter(p=>p.type!=='Balance').length,'int',`COUNTIFS(${rv('A')},${B},${rv('G')},"<>Balance")`),c(sum(pk.filter(p=>p.type==='Balance'),p=>p.amt),'num',`SUMIFS(${rv('H')},${rv('A')},${B},${rv('G')},"Balance")`)])});
    const t=months.length+3;rows.push([c('الإجمالي','labB'),c('','labB'),...Array.from({length:mc+5},(_,j)=>c(0,j===mc+3?{b:1,fmt:INTF,fill:LBLUE}:'numB',`SUM(${C(j+2)}3:${C(j+2)}${t-1})`))]);
    // fill cached totals
    rows[t-1].slice(2).forEach((cl,j)=>{cl.v=r2(rows.slice(2,t-1).reduce((s,rw)=>s+(rw[j+2].v||0),0))});
    const ns=notes(rows,t+1,'ملاحظات',[
      'التحصيلات من غير الدفع من رصيد المريض (Balance) لأنها فلوس اتحسبت قبل كده.',
      'المردودات = الدفعات المتعلّم عليها "اترجعت"، في شهر الدفع الأصلي زي تقرير Medicolize.',
      A.length?`فيه تسويات على الإيراد أو المردودات في الفترة دي (شيت التسويات)، ومش داخلة في الجدول ده: ${A.map(a=>`${a.label} ${a.amount}`).join('، ')}.`:'مفيش تسويات على الإيراد في الفترة دي.'],mc+8);
    // by doctor
    const docs=[...new Set(P.filter(p=>p.type!=='Balance').map(p=>p.doctor||'من غير دكتور'))].sort((a,b)=>sum(P.filter(p=>(p.doctor||'من غير دكتور')===b&&p.type!=='Balance'),p=>p.amt)-sum(P.filter(p=>(p.doctor||'من غير دكتور')===a&&p.type!=='Balance'),p=>p.amt));
    const dr=[[c('التحصيلات حسب الدكتور','title')],[c('الدكتور','head'),...months.map(k=>c(ml(k),'head')),c('الإجمالي','head'),c('عدد الدفعات','head')],[c('كود الشهر','key'),...months.map(k=>c(mk(k),'key'))]];
    docs.forEach((d,i)=>{const r=i+4;const pd=P.filter(p=>(p.doctor||'من غير دكتور')===d&&p.type!=='Balance');
      dr.push([c(d,'lab'),...months.map((k,j)=>c(sum(pd.filter(p=>p.k===k),p=>p.amt),'num',`SUMIFS(${rv('H')},${rv('A')},${C(j+1)}$3,${rv('F')},${d==='من غير دكتور'?'""':'$A'+r})-SUMIFS(${rv('H')},${rv('A')},${C(j+1)}$3,${rv('F')},${d==='من غير دكتور'?'""':'$A'+r},${rv('G')},"Balance")`)),c(sum(pd,p=>p.amt),'numB',`SUM(B${r}:${C(months.length)}${r})`),c(pd.length,'int')])});

  }
  // ---------- expenses for a period ----------
  function expenses(D,from,to){
    const months=monthsBetween(from,to),E=expRows(D,months),A=D.adj.filter(a=>months.includes(a.month)&&a.kind==='opex');
    const CM=months.map(k=>computeMonth(D.cfg,D.med,D.adj,k)),nm_=months.length;
    const DS='المصروفات',ev=a=>`${q(DS)}!${a}:${a}`,AD='التسويات',av=a=>`${q(AD)}!${a}:${a}`;
    const RT='الايجارات',RF='أموال مردودة الى المريض';

    const types=[...new Set(OE.map(e=>e.type).concat(A.map(a=>a.etype||'تسويات')))].sort((a,b)=>sum(OE.filter(e=>e.type===b),e=>e.amt)-sum(OE.filter(e=>e.type===a),e=>e.amt));

    rows.push([c('للمعلومة: مردودات للمرضى متسجلة كمصروف في Medicolize','lab'),...months.map((k,j)=>c(sum(E.filter(e=>e.k===k&&e.type===RF),e=>e.amt),'num',`SUMIFS(${ev('G')},${ev('A')},${C(j+1)}$3,${ev('D')},"${RF}")`))]);

    const rows=[[c('مقارنة تمويل الشركاء','title')],['التصنيف',cfg.names.A,cfg.names.K,'الإجمالي'].map(h=>c(h,'head'))];

    const t=cats.length+3;rows.push([c('الإجمالي','labB'),c(a,'numB',`SUM(B3:B${t-1})`),c(k,'numB',`SUM(C3:C${t-1})`),c(r2(a+k),'numB',`SUM(D3:D${t-1})`)]);
    rows.push([c('الفرق لصالح '+cfg.names.K,'labB'),c(r2(k-a),'big',`C${t}-B${t}`)]);
    sheets.unshift({name:'المقارنة',rows,cols:[40,15,15,15],merges:['A1:D1']});
    return {sheets};
  }
  // ---------- refunds ----------
  function refunds(D,from,to){
    const months=monthsBetween(from,to),P=payRows(D,months).filter(p=>p.ref&&p.type!=='Balance'),A=D.adj.filter(a=>months.includes(a.month)&&a.kind==='refund');
    const rows=[[c(`المردودات من ${ml(from)} لـ ${ml(to)}`,'title')],['شهر الدفع','تاريخ الدفع','تاريخ الرد','المريض','كود المريض','الدكتور','طريقة الدفع','المبلغ','المصدر'].map(h=>c(h,'head'))];

    for(const a of A)rows.push([c(ml(a.month),'lab'),c('','date'),c('','cen'),c(a.label,'txt'),c('','cen'),c('','txt'),c('','cen'),c(a.amount,'num'),c('تسوية: '+(a.note||''),'lab')]);
    const t=rows.length+1;rows.push([c('الإجمالي','labB'),...Array(6).fill(0).map(()=>c('','labB')),c(r2(sum(P,p=>p.amt)+sum(A,a=>a.amount)),'numB',`SUM(H3:H${t-1})`),c('','labB')]);
    return {sheets:[{name:'المردودات',rows,cols:[14,12,12,28,11,20,13,13,30],freeze:{r:2},merges:['A1:I1']}]};
  }
  return {full,revenue,expenses,partners,refunds};
})();

<script>

const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

const mls=k=>{const [y,m]=k.split('-');return MN[+m-1]};
const fmt=(x,d=0)=>x==null||isNaN(x)?'—':(x<0?'−':'')+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fm2=x=>fmt(x,Math.abs(x%1)>0.001?2:0);

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

const S={ads:{},pf:{},cfg:null,med:{},fund:[],adj:[],counts:{},db:null,canWrite:true,tab:'sum',endK:null,cmpA:null,cmpB:null,ledgerP:'all',edit:null,upload:null,loaded:{cfg:false,med:false,fund:false,adj:false}};
try{const t=localStorage.getItem('fz_tab');if(t)S.tab=t}catch(e){}
let charts=[];

// ---------- data ----------
async function boot(){
  if(!window.claude||!claude.use){$('#sync').textContent='البيانات مش متاحة هنا';renderEmpty('افتح الصفحة من Claude وانت مسجّل دخول عشان البيانات تظهر.');return}
  const db=await claude.use('db');
  if(!db){$('#sync').textContent='البيانات مش متاحة';renderEmpty('البيانات المحفوظة مش متاحة في العرض ده. افتح الصفحة من Claude وانت مسجّل دخول.');return}
  S.db=db;
  try{const u=await claude.use('user');if(u){const c=await u.can('data.write');if(c===false)S.canWrite=false}}catch(e){}
  const err=e=>{$('#sync').textContent='فيه مشكلة في الاتصال، اعمل تحديث للصفحة'};
  db.doc('cfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.loaded.cfg=true;ready()},err);
  db.doc('cfg/counts').onSnapshot(s=>{S.counts=s.exists?(s.data().m||{}):{};ready()},err);
  db.collection('med').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.med=m;S.loaded.med=true;ready()},err);
  db.collection('fund').onSnapshot(q=>{S.fund=q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.seq||0)-(b.seq||0));S.loaded.fund=true;ready()},err);
  db.collection('adspend').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]={...d.data(),id:d.id});S.ads=m;ready()},err);
  db.collection('payfile').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.pf=m;ready()},err);
  db.collection('adj').onSnapshot(q=>{S.adj=q.docs.map(d=>({...d.data(),id:d.id}));S.loaded.adj=true;ready()},err);
}
let rq=null;
function ready(){if(rq)return;rq=requestAnimationFrame(()=>{rq=null;if(!Object.values(S.loaded).every(Boolean))return;
  if(!S.cfg){renderEmpty('لسه مفيش إعدادات محفوظة. Claude هيضيف البيانات الأولى.');return}
  $('#sync').textContent='متحدّث';fillEnd();render()})}
function renderEmpty(t){$('#main').innerHTML=`<section class="panel empty">${esc(t)}</section>`}
function dataMonths(){return Object.keys(S.med).filter(k=>/^(pay|exp)-/.test(k)).map(k=>k.slice(4)).filter((v,i,a)=>a.indexOf(v)===i).sort()}
function fillEnd(){
  const ms=dataMonths().filter(k=>k>=S.cfg.startMonth); if(!ms.length)return;
  const now=new Date();const cur=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  if(!S.endK||!ms.includes(S.endK)){const done=ms.filter(k=>k<cur);S.endK=done.length?done[done.length-1]:ms[ms.length-1]}

  if(!S.fromK||!ms.includes(S.fromK)||S.fromK>S.endK)S.fromK=ms[0];
  $('#fromSel').innerHTML=ms.filter(k=>k<=S.endK).map(k=>`<option value="${k}" ${k===S.fromK?'selected':''}>${ml(k)}</option>`).join('');
}
// a view of the results for the chosen months; cash and partners stay cumulative from the first month
function sliceR(R,from){
  if(!from||from<=R.months[0].k)return {...R,Tall:R.T,fromK:R.months[0].k};
  const months=R.months.filter(m=>m.k>=from).map(m=>({...m}));let cum=0;
  months.forEach((m,i)=>{cum=r2(cum+m.net);m.cum=cum;if(!i){m.change=null;m.growth=null}});
  const sum=f=>r2(months.reduce((s,m)=>s+m[f],0));
  const T={revenue:sum('revenue'),refunds:sum('refunds'),netRev:sum('netRev'),opex:sum('opex'),rent:sum('rent'),mgmt:sum('mgmt'),totalExp:sum('totalExp'),net:sum('net'),salaries:sum('salaries')};T.margin=T.netRev?T.net/T.netRev:0;
  return {...R,months,T,Tall:R.T,fromK:from};
}

  const v={sum:viewSum,pl:viewPL,exp:viewExp,pts:viewPts,ret:viewRet,apt:viewApt,par:viewPar,cash:viewCash,rep:viewRep,data:viewData}[S.tab](R);

  ({sum:chartsSum,pl:chartsPL,exp:chartsExp,pts:chartsPts,ret:chartsRet,apt:bindApt,par:bindPar,cash:bindCash,rep:bindRep,data:bindData}[S.tab]||(()=>{}))(R);
}
const nm=p=>S.cfg.names[p];

// ---------- partner alerts: rent recorded in the funding ledger, and the funding gap month by month ----------
const AR_M={'يناير':1,'فبراير':2,'مارس':3,'ابريل':4,'أبريل':4,'مايو':5,'يونيو':6,'يوليو':7,'اغسطس':8,'أغسطس':8,'سبتمبر':9,'اكتوبر':10,'أكتوبر':10,'نوفمبر':11,'ديسمبر':12};
const toLat=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
// undated ledger rows: take the month written in the item ("شهر يوليو"، "شهر 8") after the previous dated row, else the previous row's month
function fundMonths(){let prev=null;return S.fund.map(f=>{let k=f.d?f.d.slice(0,7):null;
  if(!k&&prev){const t=toLat(f.item);let m=null;for(const n in AR_M)if(t.includes(n)){m=AR_M[n];break}
    if(!m){const x=t.match(/(?:شهر|سهر)\s*(\d{1,2})/);if(x)m=+x[1]}
    if(m&&m>=1&&m<=12){let y=+prev.slice(0,4);if(m<+prev.slice(5,7)-1)y++;k=y+'-'+pad(m)}else k=prev}
  if(k)prev=k;return {...f,k:k||S.cfg.startMonth}})}
function rentGaps(){
  const cur=curMonth(),months=monthsBetween(S.cfg.startMonth,cur);const due=months.map(k=>({k,amt:rentFor(S.cfg,k)}));
  const paid=fundMonths().filter(f=>/ايجار العيادة|إيجار العيادة/.test(f.cat)&&f.k>=S.cfg.startMonth).reduce((s,f)=>s+f.amt,0);
  let left=paid;const miss=[];for(const d of due){if(left>=d.amt-0.5){left-=d.amt}else{miss.push({k:d.k,amt:r2(d.amt-Math.max(0,left))});left=0}}
  return {miss,paid,due:due.reduce((s,d)=>s+d.amt,0)};
}
function rentAlert(){const g=rentGaps();if(!g.miss.length)return'';
  return `<div class="callout warn"><b>إيجار لسه ما اتسجلش في سجل التمويل</b><ul class="notes">${g.miss.map(m=>`<li>إيجار ${ml(m.k)}: ${N(m.amt)}</li>`).join('')}</ul><p class="sub" style="margin:6px 0 0">الإيجار المستحق من ${ml(S.cfg.startMonth)} لحد ${ml(curMonth())}: ${N(g.due)}، والمتسجل في التصنيف "ايجار العيادة": ${N(g.paid)}. سجّله من تبويب الشركاء.</p></div>`}
function gapSeries(){const rows=fundMonths();const ks=monthsBetween(rows.reduce((m,f)=>f.k<m?f.k:m,S.cfg.startMonth),curMonth());
  return ks.map(k=>{const a=rows.filter(f=>f.k<=k);const A=a.filter(f=>f.p==='A').reduce((s,f)=>s+f.amt,0),K=a.filter(f=>f.p==='K').reduce((s,f)=>s+f.amt,0);
    const inM=rows.filter(f=>f.k===k);return {k,A,K,gap:r2(K-A),mA:inM.filter(f=>f.p==='A').reduce((s,f)=>s+f.amt,0),mK:inM.filter(f=>f.p==='K').reduce((s,f)=>s+f.amt,0)}})}
function gapPanel(){const G=gapSeries();if(!G.length)return'';const L=G[G.length-1];
  return `<section class="panel"><h2>فرق التمويل شهر بشهر</h2><p class="sub">موجب = لصالح ${nm('K')}، سالب = لصالح ${nm('A')}. الحركات اللي من غير تاريخ اتحطت في الشهر المكتوب في البند، أو بعد آخر حركة ليها تاريخ.</p>
  <div class="chart"><canvas id="gp1"></canvas></div>
  <div class="tbl" style="margin-top:10px"><table class="stk"><thead><tr><th>الشهر</th><th class="n">دفع ${nm('A')}</th><th class="n">دفع ${nm('K')}</th><th class="n">الفرق التراكمي</th></tr></thead><tbody>
  ${G.slice().reverse().map(g=>`<tr><td>${ml(g.k)}</td><td class="n">${g.mA?N(g.mA):'<span class="muted">—</span>'}</td><td class="n">${g.mK?N(g.mK):'<span class="muted">—</span>'}</td><td class="n">${N(g.gap,g.gap>0?'':'neg')}</td></tr>`).join('')}</tbody></table></div></section>`}
function chartGap(){const G=gapSeries();if(!G.length)return;
  mk('gp1',{type:'bar',data:{labels:G.map(g=>mls(g.k)+' '+g.k.slice(2,4)),datasets:[{type:'line',label:'الفرق التراكمي',data:G.map(g=>g.gap),borderColor:css('--ink'),pointRadius:2,borderWidth:2,tension:0},
    {label:'دفع '+nm('A'),data:G.map(g=>g.mA),backgroundColor:css('--accent')},{label:'دفع '+nm('K'),data:G.map(g=>g.mK),backgroundColor:css('--warn')}]},options:baseOpts()})}

// ---------- money still owed by patients (Medicolize "Remaining") ----------
function owedPanel(src){
  const D=retData(),byId={};D.P.forEach(p=>byId[p.id]=p);
  const L=[];for(const d of Object.values(S.med))if(d.kind==='pts')for(const r of d.rows){const rem=+r[9]||0;if(rem<=0)continue;const p=byId[r[1]]||{};if(src&&refName(r[4])!==src)continue;
    L.push({id:r[1],name:r[2],phone:r[8]||'',src:refName(r[4]),rem,paid:+r[6]||0,sess:p.sess||0,active:!!p.active,last:p.last||'',reg:r[0].slice(0,10)})}

   ${busyD.length?`<ul class="notes"><li>أزحم يوم: <b>${DAYS[busyD[0].d]}</b> (${(busyD[0].n/weeks).toFixed(1)} موعد في الأسبوع)، وأهدى يوم: <b>${DAYS[busyD[busyD.length-1].d]}</b> (${(busyD[busyD.length-1].n/weeks).toFixed(1)}).</li>
   <li>أزحم ساعات: ${busyH.slice(0,3).map(x=>`<b>${x.hh}:00</b>`).join('، ')}. أهدى ساعات: ${busyH.filter(x=>x.n).slice(-3).map(x=>`${x.hh}:00`).join('، ')}.</li>
   <li>${I(done.length)} موعد في ${workDays} يوم شغل، يعني حوالي ${(done.length/Math.max(1,workDays)).toFixed(1)} موعد في اليوم.</li></ul>`:''}
   <div class="tbl"><table class="stk"><thead><tr><th>الساعة</th>${days.map(d=>`<th class="n">${DAYS[d]}</th>`).join('')}<th class="n">الإجمالي</th></tr></thead><tbody>
   ${hrs.map(hh=>`<tr><td class="num">${pad(hh)}:00</td>${days.map(d=>{const v=cell[d+'|'+hh]||0;return `<td class="n" style="${heat(v)}">${v?(v/weeks).toFixed(1):''}</td>`}).join('')}<td class="n">${(hrTot.find(x=>x.hh===hh).n/weeks).toFixed(1)}</td></tr>`).join('')}</tbody></table></div></section>
  <div class="grid2"><section class="panel"><h2>الأوض</h2><div class="tbl"><table><thead><tr><th>الأوضة</th><th class="n">مواعيد</th><th class="n">في يوم الشغل</th><th class="n">من الإجمالي</th></tr></thead><tbody>

// ---------- backup / restore of everything the page keeps ----------
const BK_COLS=['cfg','med','fund','adj','adspend','payfile','payfile_chunks'];
async function makeBackup(btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent='بيجهّز…';
  try{const out={app:'fixzone-accounts',version:1,made:new Date().toISOString(),data:{}};
    for(const c of BK_COLS){const q=await S.db.collection(c).get();out.data[c]={};q.docs.forEach(d=>out.data[c][d.id]=d.data())}
    const n=Object.values(out.data).reduce((s,x)=>s+Object.keys(x).length,0);
    await saveBlob(new TextEncoder().encode(JSON.stringify(out)),`نسخة احتياطية FIX ZONE ${new Date().toISOString().slice(0,10)}.json`);
    try{localStorage.setItem('fz_lastBackup',new Date().toISOString())}catch(e){}
    toast(`اتنزلت نسخة فيها ${n} سجل`)}
  catch(e){console.error(e);toast('ما اتعملتش، جرّب تاني')}finally{btn.disabled=false;btn.textContent=old}}
async function saveBlob(data,filename){const dl=await claude.use('downloads');if(!dl){toast('التنزيل مش متاح هنا');throw new Error('no dl')}try{await dl.save({filename,data})}catch(e){if(!(e&&e.code==='declined'))throw e}}
async function readBackup(file){
  try{const j=JSON.parse(await file.text());if(j.app!=='fixzone-accounts'||!j.data)throw new Error('bad');
    S.restore={file:file.name,made:j.made,data:j.data,counts:Object.fromEntries(Object.entries(j.data).map(([c,x])=>[c,Object.keys(x).length]))}}
  catch(e){S.restore={error:'الملف ده مش نسخة احتياطية من الأداة دي.'}}
  render();$('#bkPanel')?.scrollIntoView({block:'start'});
}
async function doRestore(btn){
  const R=S.restore;if(!R||!R.data)return;btn.disabled=true;
  try{let i=0;const tot=Object.values(R.data).reduce((s,x)=>s+Object.keys(x).length,0);
    for(const c of BK_COLS){const want=R.data[c]||{};const q=await S.db.collection(c).get();
      for(const d of q.docs)if(!(d.id in want)){await S.db.doc(c+'/'+d.id).delete()}
      for(const [id,v] of Object.entries(want)){await S.db.doc(c+'/'+id).set(v);i++;if(i%10===0)btn.textContent=`بيرجّع… ${i} من ${tot}`}}
    S.restore=null;toast('النسخة رجعت');render()}
  catch(e){console.error(e);toast('حصلت مشكلة في النص. جرّب تاني بنفس الملف');btn.disabled=false;btn.textContent='رجّع النسخة دي'}}

   <div class="row"><button type="button" class="pri" id="bkDown">نزّل نسخة احتياطية</button>${S.canWrite?`<button type="button" data-pick="bkFile">رجّع من نسخة</button><input type="file" id="bkFile" class="vh" tabindex="-1" aria-hidden="true" accept=".json,application/json">`:''}
   <span class="status">${last?'آخر نسخة من الجهاز ده: '+last.slice(0,10):'لسه ما نزّلتش نسخة من الجهاز ده'}</span></div>

function pendingBox(R){

function insights(R){
  const M=R.months.filter(m=>m.hasPay||m.hasExp);const L=M[M.length-1];const out=[];
  const prof=M.filter(m=>m.net>0);
  out.push(R.T.net<0?`المكان خسران ${N(-R.T.net,'neg')} من ${ml(M[0].k)} لـ ${ml(L.k)} (هامش ${pct(R.T.margin)}). ${prof.length?`الشهور اللي كسبت: ${prof.map(m=>mls(m.k)).join('، ')}.`:'مفيش شهر كسبان لحد دلوقتي.'}`:`المكان كسبان ${N(R.T.net,'pos')} من ${ml(M[0].k)} لـ ${ml(L.k)} (هامش ${pct(R.T.margin)}).`);
  if(M.length>=6){const a=M.slice(0,3),b=M.slice(-3);const av=x=>x.reduce((s,m)=>s+m.net,0)/x.length;const A=av(a),B=av(b);

function warnings(){
  const out=[];const rentBad={};
  const docs=Object.values(S.med).filter(d=>d.kind==='exp').sort((a,b)=>a.month<b.month?-1:1);
  for(const d of docs){const k=d.month;
    const rent=S.cfg?rentFor(S.cfg,k):0;const rec=d.rows.filter(r=>r[2]===RENT_TYPE).reduce((s,r)=>s+r[1],0);
    if(rent&&rec&&Math.abs(rec-rent)>0.5){(rentBad[rec]=rentBad[rec]||[]).push(k)}
    const rows=d.rows.slice().sort((a,b)=>a[0]<b[0]?-1:1);
    for(let i=1;i<rows.length;i++){const a=rows[i-1],b=rows[i];if(a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3]&&(new Date(b[0])-new Date(a[0]))<=15*60000)out.push(`${ml(k)}: "${esc(b[3]||b[2])}" بمبلغ ${fmt(b[1])} متسجل مرتين ورا بعض (${b[0].slice(5,10)}). ممكن يكون مكرر.`)}

}

const PF_EXT=['xlsx','pdf','csv','docx','zip'],PF_CH=180000,PF_MAX=4*1024*1024;
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function payrollPanel(edit){
  const ks=Object.keys(S.pf).sort().reverse();

   <p class="sub">Excel أو PDF، لحد 4 ميجا. لو الشهر عنده ملف قبل كده، الجديد هيحل محله.</p>`:''}
  <div class="tbl"><table><thead><tr><th>الشهر</th><th>الملف</th><th class="n">الحجم</th><th>اترفع</th><th></th></tr></thead><tbody>
  ${ks.map(k=>{const f=S.pf[k];return `<tr><td>${ml(k)}</td><td>${esc(f.name)}</td><td class="n num">${kb(f.size)}</td><td class="num muted">${esc(String(f.uploaded||'').slice(0,10))}</td>
   <td><div class="row" style="flex-wrap:nowrap"><button type="button" data-pfdl="${k}">نزّل</button>${edit&&S.canWrite?`<button class="ghost" type="button" data-pfdel="${k}">امسح</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">لسه مفيش ملفات مرتبات. اختار الشهر والملف من فوق.</td></tr>'}</tbody></table></div></section>`;
}
async function savePayroll(file,month,btn){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!PF_EXT.includes(ext)){toast('الملف لازم يكون xlsx أو pdf أو csv أو docx أو zip');return}
  if(file.size>PF_MAX){toast('الملف أكبر من 4 ميجا');return}
  btn.disabled=true;btn.textContent='بيرفع…';
  try{const s=b64(await file.arrayBuffer());const n=Math.ceil(s.length/PF_CH)||1;const old=S.pf[month];
    for(let i=0;i<n;i++)await S.db.doc(`payfile_chunks/${month}-${i}`).set({m:month,i,d:s.slice(i*PF_CH,(i+1)*PF_CH)});
    if(old)for(let i=n;i<(old.n||0);i++)await S.db.doc(`payfile_chunks/${month}-${i}`).delete();
    await S.db.doc('payfile/'+month).set({month,name:file.name,size:file.size,ext,n,uploaded:new Date().toISOString()});
    toast('ملف المرتبات اتحفظ')}
  catch(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'المساحة خلصت':'ما اتحفظش، جرّب تاني')}
  finally{btn.disabled=false;btn.textContent=btn.id==='pfQuickBtn'?'ارفع':'ارفع ملف المرتبات'}}
async function dlPayroll(month,btn){
  const f=S.pf[month];if(!f)return;const old=btn.textContent;btn.disabled=true;btn.textContent='بيجهّز…';
  try{let s='';for(let i=0;i<f.n;i++){const d=await S.db.doc(`payfile_chunks/${month}-${i}`).get();if(!d.exists)throw new Error('missing');s+=d.data().d}
    const dl=await claude.use('downloads');if(!dl){toast('التنزيل مش متاح هنا');return}
    await dl.save({filename:f.name,data:unb64(s)})}
  catch(e){if(!(e&&e.code==='declined')){console.error(e);toast(e&&e.message==='missing'?'الملف ناقص، ارفعه تاني':'ما اتنزلش، جرّب تاني')}}
  finally{btn.disabled=false;btn.textContent=old}}
async function delPayroll(month){const f=S.pf[month];if(!f)return;
  try{for(let i=0;i<(f.n||0);i++)await S.db.doc(`payfile_chunks/${month}-${i}`).delete();await S.db.doc('payfile/'+month).delete();toast('اتمسح')}catch(e){toast('ما اتمسحش، جرّب تاني')}}
function bindPayroll(){
  document.querySelectorAll('[data-mdel]').forEach(b=>b.onclick=()=>confirmBtn(b,()=>W(S.db.doc('med/'+b.dataset.mdel).delete(),'اتمسح')));

  $('#pfQuick')?.addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)savePayroll(f,chkMonth(),$('#pfQuickBtn'))});
  document.querySelectorAll('[data-pfdl]').forEach(b=>b.onclick=()=>dlPayroll(b.dataset.pfdl,b));
  document.querySelectorAll('[data-pfdel]').forEach(b=>b.onclick=()=>confirmBtn(b,()=>delPayroll(b.dataset.pfdel)));

function cellStr(v){return v==null?'':String(v).trim()}

async function parseFile(file){
  const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const sh=wb.Sheets['data']||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sh,{defval:null,raw:true});
  if(!rows.length)throw new Error(`الملف ${file.name} فاضي`);
  const h=Object.keys(rows[0]);
  if(h.includes('First Name')&&h.includes('Referral')&&h.includes('Created')){
    const by={};let count=0,skipped=0;const branch=S.cfg?.branch,start=S.cfg?.startMonth||'0';
    const ds=v=>{const d=toDate(v);return d?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:''};
    for(const r of rows){const d=toDate(r.Created);if(!d)continue;if(branch&&r.Branch&&cellStr(r.Branch)!==branch){skipped++;continue}
      const k=d.getFullYear()+'-'+pad(d.getMonth()+1);if(k<start){skipped++;continue}by[k]=by[k]||[];
      by[k].push([`${ds(r.Created)}T${pad(d.getHours())}:${pad(d.getMinutes())}`,'#'+cellStr(r.ID),(cellStr(r['First Name'])+' '+cellStr(r['Last Name'])).trim(),cellStr(r.Gender),cellStr(r.Referral),cellStr(r['Referral Details']),Number(r['Total Payments'])||0,ds(r['First Payment Date']),cellStr(r['Phone Number']).replace(/_/g,' '),Number(r.Remaining)||0]);count++}
    return {name:file.name,kind:'pts',by,months:Object.keys(by).sort(),count,total:count,skipped}}
  if(h.includes('Start')&&h.includes('Status')&&h.includes('Type')&&!h.includes('Amount')){
    // completed sessions are stored by month; upcoming bookings go to one separate list so a bookings-only export never wipes a month
    const by={},fut=[];let count=0,total=0,skipped=0;const branch=S.cfg?.branch;const n0=new Date(),today=`${n0.getFullYear()}-${pad(n0.getMonth()+1)}-${pad(n0.getDate())}`;
    for(const r of rows){const d=toDate(r.Start);if(!d)continue;if(branch&&r.Branch&&cellStr(r.Branch)!==branch){skipped++;continue}
      const st=cellStr(r.Status),ts=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const row=[ts,cellStr(r.Type),cellStr(r['Patient ID']),cellStr(r.Patient),cellStr(r.Doctor),st,cellStr(r.Room)];count++;
      // past appointments of every status are kept by month (cancellations and no-shows are analysed); only Completed ones count as sessions
      if(ts.slice(0,10)<today||st==='Completed'){const k=ts.slice(0,7);(by[k]=by[k]||[]).push(row);if(st==='Completed')total++}
      else if(!/cancel|no.?show|missed|reject/i.test(st))fut.push(row)}
    return {name:file.name,kind:'apt',by,fut,months:Object.keys(by).sort(),count,total,skipped}}
  const isExp=h.includes('Expense Type');const isPay=!isExp&&h.includes('Amount')&&(h.includes('Patient')||h.includes('Refunded'));
  if(!isExp&&!isPay)throw new Error(`الملف ${file.name} مش شكل ملفات Medicolize (لازم يكون فيه Amount و Created)`);
  const by={};let count=0,total=0,skipped=0;const branch=S.cfg?.branch;
  for(const r of rows){const d=toDate(r.Created);const a=Number(r.Amount);if(!d||!isFinite(a))continue;
    if(isPay&&branch&&r.Branch&&cellStr(r.Branch)!==branch){skipped++;continue}
    const k=d.getFullYear()+'-'+pad(d.getMonth()+1);by[k]=by[k]||[];
    const ref=r.Refunded===true||String(r.Refunded).toUpperCase()==='TRUE'?1:0;
    if(isPay){const rd=r['Refund Date']?toDate(r['Refund Date']):null;by[k].push([d.getDate(),Math.round(a*100)/100,cellStr(r.Type),ref,pad(d.getHours())+':'+pad(d.getMinutes()),cellStr(r.Patient),cellStr(r['Patient ID']),cellStr(r.Doctor),cellStr(r['Invoice ID']),cellStr(r['Created By']),rd?`${rd.getFullYear()}-${pad(rd.getMonth()+1)}-${pad(rd.getDate())}`:''])}
    else by[k].push([`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`,Math.round(a*100)/100,cellStr(r['Expense Type']),cellStr(r['Expense Info']),cellStr(r.Type),ref,cellStr(r['Created By'])]);
    count++;if(!(isPay&&cellStr(r.Type)==='Balance'))total+=a}
  return {name:file.name,kind:isPay?'pay':'exp',by,months:Object.keys(by).sort(),count,total,skipped};
}
async function handleFiles(list){
  if(!window.XLSX){S.upload={error:'مكتبة قراءة Excel ما اتحملتش، اعمل تحديث للصفحة'};render();return}
  try{let files=[];for(const f of list)files.push(await parseFile(f));
    // appointments come split over several exports: merge them, drop duplicates
    const ap=files.filter(f=>f.kind==='apt');if(ap.length>1){const by={},seen=new Set(),fs=new Set(),fut=[];let count=0,total=0;
      for(const f of ap)for(const r of f.fut||[]){const key=r[0]+'|'+r[2]+'|'+r[1];if(!fs.has(key)){fs.add(key);fut.push(r)}}
      for(const f of ap)for(const k of f.months)for(const r of f.by[k]){const key=r[0]+'|'+r[2]+'|'+r[1];if(seen.has(key))continue;seen.add(key);(by[k]=by[k]||[]).push(r);count++;if(r[5]==='Completed')total++}
      files=files.filter(f=>f.kind!=='apt').concat([{name:ap.map(f=>f.name).join(' + '),kind:'apt',by,fut,months:Object.keys(by).sort(),count,total,skipped:ap.reduce((s,f)=>s+f.skipped,0)}])}
    S.upload={files,skipped:files.reduce((s,f)=>s+f.skipped,0)}}
  catch(e){S.upload={error:e.message||'ما قدرتش أقرا الملف'}}
  render();$('#upPrev')?.scrollIntoView({block:'center',behavior:'smooth'});
}

  if(pM.length){const tot={};pM.forEach(m=>{for(const s in m.src)tot[s]=(tot[s]||0)+m.src[s].n});const top=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);const pal=['#0E6B66','#9A5B00','#6A1B9A','#1C7A3D','#B42A22','#1F3864','#5FA8A3','#D9A441','#B48AD0','#7CC28F','#E08A84'];
    imgs.push(chartPng({type:'bar',stacked:true,title:'المرضى الجداد حسب مصدر التحويل',data:{labels:pK.map(x=>mls(x)+' '+x.slice(2,4)),datasets:top.map((s,i)=>({label:s,data:pM.map(m=>(m.src[s]||{n:0}).n),backgroundColor:pal[i%pal.length]}))}}));}
  const D=retData(),RP_=D.P.filter(p=>p.coh>=S.cfg.startMonth&&p.coh<=k),cohs=[...new Set(RP_.map(p=>p.coh))].sort();
  const rs=cohs.map(x=>bucketRow(RP_.filter(p=>p.coh===x&&!p.pend)));
  if(cohs.length)imgs.push(chartPng({type:'bar',stacked:true,pctAxis:true,title:'نسبة اللي وصلوا 12 جلسة (حسب شهر التسجيل)',data:{labels:cohs.map(x=>mls(x)+' '+x.slice(2,4)),datasets:[{label:'12 بالظبط',data:rs.map(r=>r.n?Math.round(r.c.b12/r.n*1000)/10:0),backgroundColor:'#0E6B66'},{label:'أكتر من 12',data:rs.map(r=>r.n?Math.round(r.c.b13/r.n*1000)/10:0),backgroundColor:'#1C7A3D'}]}}));
  const MA=M.filter(m=>m.hasApt);if(MA.length)imgs.push(chartPng({type:'bar',title:'الجلسات الفعلية مقابل المطلوب للتعادل',data:{labels:MA.map(m=>mls(m.k)+' '+m.k.slice(2,4)),datasets:[{type:'line',label:'المطلوب للتعادل',data:MA.map(m=>m.needBE),borderColor:'#B42A22',borderDash:[6,4],pointRadius:3,borderWidth:2},{label:'الجلسات',data:MA.map(m=>m.units),backgroundColor:'#0E6B66'}]}}));
  const ROWS=24;sheets.push({name:'الرسومات',rows:[[c(`رسومات تقرير ${ml(k)}`,'title')]],cols:[16,16,16,16,16,16,16,16],merges:['A1:H1'],images:imgs.map((im,i)=>({...im,col:0,row:2+i*ROWS}))});
  // 3. P&L
  const pl=[[c(`الأرباح والخسائر من ${ml(M[0].k)} لـ ${ml(k)}`,'title')],['الشهر','الإيراد','مردودات','صافي الإيراد','مصروفات التشغيل','الإيجار','نسبة الإدارة','إجمالي المصروفات','صافي الربح (الخسارة)','التراكمي','الهامش','نقطة التعادل','البعد عن التعادل','الجلسات'].map(x=>c(x,'head'))];
  M.forEach(m=>pl.push([c(ml(m.k),'lab'),c(m.revenue,'num'),c(m.refunds,'num'),c(m.netRev,'num'),c(m.opex,'num'),c(m.rent,'num'),c(m.mgmt,'num'),c(m.totalExp,'num'),c(m.net,'num'),c(m.cum,'num'),c(m.margin,'pct'),c(m.breakEven,'num'),c(m.gap,'num'),c(m.hasApt?m.sessions:'','num')]));
  pl.push([c('الإجمالي','labB'),c(T.revenue,'numB'),c(T.refunds,'numB'),c(T.netRev,'numB'),c(T.opex,'numB'),c(T.rent,'numB'),c(T.mgmt,'numB'),c(T.totalExp,'numB'),c(T.net,'numB'),c('','labB'),c(T.margin,'pctB'),c('','labB'),c('','labB'),c(M.reduce((s,m)=>s+(m.sessions||0),0),'numB')]);
  sheets.push({name:'الأرباح والخسائر',rows:pl,cols:[14,12,11,13,13,11,12,14,15,13,9,13,13,10],freeze:{r:2,c:1},merges:['A1:N1']});
  // 4. partners
  const pr=[[c(`موقف الشركاء لحد ${ml(k)}`,'title')],['البند',nmA,nmK,'ملاحظة'].map(x=>c(x,'head')),
    [c(`التمويل لحد آخر ${ml(k)}`,'lab'),c(R.P.A.cut,'num'),c(R.P.K.cut,'num'),c('')],[c('التمويل لحد النهارده','lab'),c(R.P.A.all,'num'),c(R.P.K.all,'num'),c('')],
    [c('الفرق في التمويل','labB'),c(R.diffAll<0?-R.diffAll:0,'numB'),c(R.diffAll>0?R.diffAll:0,'numB'),c('لصالح الشريك اللي قدامه رقم','note')],[],
    [c('الفلوس في الخزنة','lab'),c(R.cash,'num'),c(''),c(R.T.net<0?'كلها تمويل لسه ما اتصرفش، مش أرباح':'','note')],
    [c('أولاً: فرق التمويل يرجع لصاحبه','lab'),c(R.dist.firstA,'num'),c(R.dist.firstK,'num')],[c('ثانياً: الباقي بالنسبة','lab'),c(R.dist.restA,'num'),c(R.dist.restK,'num')],[c('يتصرف لكل واحد','labB'),c(R.dist.A,'numB'),c(R.dist.K,'numB')],[],
    ['التصنيف',nmA,nmK,'الإجمالي'].map(x=>c(x,'head'))];
  Object.entries(R.cats).forEach(([ct,v])=>pr.push([c(ct,'lab'),c(v.A,'num'),c(v.K,'num'),c(v.A+v.K,'num')]));
  if(R.pending.length){pr.push([]);pr.push([c('بنود مفتوحة','sec')]);R.pending.forEach(f=>pr.push([c(f.item,'lab'),c(f.p==='A'?f.amt:'','num'),c(f.p==='K'?f.amt:'','num'),c(f.note||'','note')]))}
  sheets.push({name:'الشركاء',rows:pr,cols:[44,16,16,40],merges:['A1:D1']});
  // 5. patients & sources
  if(pM.length){const all=mergePts(pM),srcs=Object.keys(all.src).sort((a,b)=>all.src[b].n-all.src[a].n);
    const pa=[[c('المرضى الجداد ومصادر التحويل','title')],[c(`${ml(k)}`,'sec')],['المصدر','مرضى',P?ml(P.k):'','دفعوا'].map(x=>c(x,'head'))];
    if(pk)Object.keys(pk.src).sort((a,b)=>pk.src[b].n-pk.src[a].n).forEach(s=>pa.push([c(s,'lab'),c(pk.src[s].n,'num'),c(pp&&pp.src[s]?pp.src[s].n:0,'num'),c(pk.src[s].n?pk.src[s].paid/pk.src[s].n:0,'pct')]));
    if(pk)pa.push([c('الإجمالي','labB'),c(pk.n,'numB'),c(pp?pp.n:'','numB'),c(pk.n?pk.paid/pk.n:0,'pctB')]);
    pa.push([]);pa.push([c(`كل الفترة من ${ml(pK[0])} لـ ${ml(k)}`,'sec')]);
    const ads={};Object.values(S.ads).filter(a=>a.month>=pK[0]&&a.month<=k).forEach(a=>ads[a.src]=(ads[a.src]||0)+(+a.amount||0));
    const PPall=D.P.filter(p=>p.coh>=pK[0]&&p.coh<=k);
    pa.push(['المصدر','مرضى','النسبة','دفعوا','المدفوع لحد النهارده','متوسط للي دفع','مصاريف الدعاية','كل جنيه دعاية رجّع','وصلوا 12+'].map(x=>c(x,'head')));
    srcs.forEach(s=>{const x=all.src[s],sp=ads[s]||0,br=bucketRow(PPall.filter(p=>p.src===s&&!p.pend));pa.push([c(s,'lab'),c(x.n,'num'),c(x.n/all.n,'pct'),c(x.paid/x.n,'pct'),c(x.pay,'num'),c(x.paid?x.pay/x.paid:'','num'),c(sp||'','num'),c(sp?x.pay/sp:'','num2'),c(br.n?br.r12:'','pct')])});
    const bt=bucketRow(PPall.filter(p=>!p.pend));pa.push([c('الإجمالي','labB'),c(all.n,'numB'),c(1,'pctB'),c(all.paid/all.n,'pctB'),c(all.pay,'numB'),c(all.paid?all.pay/all.paid:'','numB'),c(Object.values(ads).reduce((a,b)=>a+b,0)||'','numB'),c('','labB'),c(bt.r12,'pctB')]);
    pa.push([]);pa.push([c('"المدفوع" لحد يوم رفع ملف المرضى، فالشهور الأحدث بتبان أقل. "وصلوا 12+" من غير المرضى الحاليين اللي لسه تحت 12 جلسة.','note')]);
    sheets.push({name:'المرضى والتحويلات',rows:pa,cols:[24,10,12,10,16,14,14,14,11],merges:['A1:I1',`A${pa.length}:I${pa.length}`]});}
  // 6. retention
  if(cohs.length){const BKs=BK;const re=[[c('استمرار المرضى الجداد (جلسات العلاج الطبيعي)','title')],[c('الحاليين اللي لسه تحت 12 جلسة مش داخلين في النسب. التارجت 12 جلسة حد أدنى، وأكتر من 12 هو المثالي.','note')],
      ['شهر التسجيل','اتسجلوا','حاليين تحت 12',...BKs.map(b=>b.l),'12+'].map(x=>c(x,'head'))];
    cohs.forEach(x=>{const a=RP_.filter(p=>p.coh===x),r=bucketRow(a.filter(p=>!p.pend));re.push([c(ml(x),'lab'),c(a.length,'num'),c(a.filter(p=>p.pend).length,'num'),...BKs.map(b=>c(r.c[b.k],'num')),c(r.r12,'pct')])});
    const ta=bucketRow(RP_.filter(p=>!p.pend));re.push([c('الإجمالي','labB'),c(RP_.length,'numB'),c(RP_.filter(p=>p.pend).length,'numB'),...BKs.map(b=>c(ta.c[b.k],'numB')),c(ta.r12,'pctB')]);
    const ths=[...new Set(RP_.flatMap(p=>p.ths))].map(t=>({t,r:bucketRow(RP_.filter(p=>p.ths.includes(t)&&!p.pend)),all:RP_.filter(p=>p.ths.includes(t)).length})).sort((a,b)=>b.all-a.all);
    if(ths.length){re.push([]);re.push([c('حسب الأخصائي (40% أو أكتر من الجلسات، وجلسة على الأقل من آخر 3. المريض المشترك بيتحسب للاتنين)','sec')]);re.push(['الأخصائي','مرضى','اتحسبوا',...BKs.filter(b=>b.k!=='none'&&b.k!=='exam').map(b=>b.l),'12+','متوسط الجلسات'].map(x=>c(x,'head')));
      ths.forEach(x=>re.push([c(x.t,'lab'),c(x.all,'num'),c(x.r.n,'num'),...BKs.filter(b=>b.k!=='none'&&b.k!=='exam').map(b=>c(x.r.c[b.k],'num')),c(x.r.r12,'pct'),c(x.r.avg,'num2')]))}
    sheets.push({name:'الاستمرار',rows:re,cols:[24,10,12,10,10,10,10,10,10,10,10,12],freeze:{r:3,c:1},merges:['A1:K1','A2:K2']});}
  return {sheets};
}
async function partnerReport(btn){
  if(!S.R){toast('مفيش بيانات');return}if(!window.Chart){toast('مكتبة الرسومات ما اتحملتش، اعمل تحديث للصفحة');return}
  const old=btn.textContent;btn.disabled=true;btn.textContent='بيجهّز التقرير…';
  try{await new Promise(r=>setTimeout(r,30));const spec=reportSpec(S.R);btn.disabled=false;btn.textContent=old;await saveXlsx(spec,`تقرير FIX ZONE ${ml(S.endK)}.xlsx`,btn)}
  catch(e){console.error(e);toast('التقرير ما اتعملش، جرّب تاني')}finally{btn.disabled=false;btn.textContent=old}
}
function viewRep(R){
  const ms=dataMonths().filter(k=>k>=S.cfg.startMonth);
  if(!S.rf||!ms.includes(S.rf))S.rf=ms[0];if(!S.rt||!ms.includes(S.rt))S.rt=S.endK;
  const opt=sel=>ms.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${ml(k)}</option>`).join('');
  return `<section class="panel"><h2>تقرير الشهر للشركاء</h2><p class="sub">ملف Excel واحد لشهر ${ml(S.endK)} تبعته للشركاء: ملخص الشهر مقارنة باللي قبله، واتحسن إيه واتراجع إيه، و6 رسومات، والأرباح والخسائر، وموقف الشركاء، والمرضى ومصادر التحويل وعائدها، والاستمرار حسب الشهر والأخصائي. غيّر الشهر من "لحد شهر" فوق.</p>
   <button class="pri" type="button" id="rReport">نزّل تقرير ${ml(S.endK)}</button></section>
  <section class="panel"><h2>الملف الكامل (زي ملفات المحاسبين)</h2><p class="sub">من ${ml(S.cfg.startMonth)} لحد ${ml(S.endK)}. غيّر الشهر من فوق لو عايز شهر تاني.</p>
   <ul class="notes"><li><b>ملخص</b> بأهم الأرقام.</li><li><b>الأرباح والخسائر</b> كل شهر، بالإيجار ونسبة الإدارة ونقطة التعادل.</li><li><b>المصروفات حسب البند</b> كل شهر، ومعاها الإيجار ونسبة الإدارة وإجمالي كل المصروفات.</li><li><b>الخزنة</b> خطوة خطوة، وحركتها كل شهر.</li><li><b>جاري الشركاء</b>: الموقف والتصنيفات ورجوع التمويل والبنود المفتوحة وسجل التمويل كامل.</li><li><b>التسويات</b>، و<b>كل الدفعات والمصروفات بالتفصيل</b>.</li></ul>
   <p class="sub">كل الأرقام معادلات مربوطة بشيتات التفاصيل، فالمحاسب يقدر يعدّل أو يضيف سطر والقوائم تتحسب تاني. الخانات الزرقا الغامقة (الإيجار ونسبة الإدارة) قيم يدخلها بنفسه.</p>
   <button class="pri" type="button" id="rFull">نزّل الملف الكامل</button></section>
  <section class="panel"><h2>تقارير لفترة تختارها</h2>
   <div class="row" style="margin-bottom:12px"><label for="rFrom" class="muted">من</label><select id="rFrom">${opt(S.rf)}</select><label for="rTo" class="muted">لـ</label><select id="rTo">${opt(S.rt)}</select></div>
   <div class="tbl"><table><tbody>
    <tr><td><b>الإيرادات</b><div class="muted">التحصيلات كل شهر حسب طريقة الدفع، والمردودات، وعدد الدفعات، والتحصيلات حسب الدكتور، وكل دفعة بالتفصيل (المريض والدكتور والفاتورة ومين سجّلها).</div></td><td style="width:1%"><button type="button" id="rRev">نزّل</button></td></tr>
    <tr><td><b>المصروفات</b><div class="muted">كل المصروفات على المكان كل شهر: بنود التشغيل والإيجار ونسبة الإدارة، ونسبة كل بند من الإجمالي، وكل مصروف بالتفصيل، والتسويات.</div></td><td><button type="button" id="rExp">نزّل</button></td></tr>
    <tr><td><b>المردودات</b><div class="muted">كل دفعة اترجعت: المريض وتاريخ الدفع وتاريخ الرد والمبلغ، ومعاها تسويات المردودات.</div></td><td><button type="button" id="rRef">نزّل</button></td></tr>
   </tbody></table></div></section>
  ${payrollPanel(false)}
  <section class="panel"><h2>كشف حساب الشركاء</h2><p class="sub">كشف لكل شريك لوحده بالرصيد بعد كل حركة، وشيت مقارنة بالتصنيفات والفرق.</p><button type="button" id="rPar">نزّل كشف الحساب</button></section>`;
}
function bindRep(){bindPayroll();
  $('#rReport')?.addEventListener('click',e=>partnerReport(e.currentTarget));
  $('#rFrom').onchange=e=>{S.rf=e.target.value;if(S.rt<S.rf)S.rt=S.rf;render()};$('#rTo').onchange=e=>{S.rt=e.target.value;if(S.rt<S.rf)S.rf=S.rt;render()};
  const per=`من ${ml(S.rf)} لـ ${ml(S.rt)}`;
  $('#rFull').onclick=e=>fullFile(e.currentTarget);
  $('#rRev').onclick=e=>saveXlsx(RP.revenue(DD(),S.rf,S.rt),`إيرادات FIX ZONE ${per}.xlsx`,e.currentTarget);
  $('#rExp').onclick=e=>saveXlsx(RP.expenses(DD(),S.rf,S.rt),`مصروفات FIX ZONE ${per}.xlsx`,e.currentTarget);
  $('#rRef').onclick=e=>saveXlsx(RP.refunds(DD(),S.rf,S.rt),`مردودات FIX ZONE ${per}.xlsx`,e.currentTarget);
  $('#rPar').onclick=e=>saveXlsx(RP.partners(DD()),`كشف حساب الشركاء FIX ZONE.xlsx`,e.currentTarget);
}
boot();
